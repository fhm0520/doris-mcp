[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doris-mcp"
version = "0.1.0"
description = "Read-only MCP server for Apache Doris 1.2.x: run read-only SQL, inspect schema"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "doris", "apache-doris", "sql", "olap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=2.3,<3",
    "pymysql>=1.1.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
doris-mcp = "doris_mcp.main:main_sync"

[tool.hatch.build.targets.wheel]
packages = ["src/doris_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 显式固定规则集，避免不同 ruff 版本的默认值变化导致 CI 结果漂移
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "ISC", "PYI"]
# 中文注释里的全角标点是刻意为之
ignore = ["RUF001", "RUF002", "RUF003"]
